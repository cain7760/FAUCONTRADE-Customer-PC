<html lang="zh-CN">

  <title>FAUCON TRADE · 官网内容初稿</title>
  <style>
    :root { --ink:#20242a; --muted:#66707a; --line:#dfe3e6; --paper:#fff; --wash:#f4f5f6; --gold:#a37d32; --dark:#191c20; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; scroll-padding-top:100px; }
    body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.75 Inter,"PingFang SC","Microsoft YaHei",sans-serif; }
    button,input,select { font:inherit; }
    a { color:inherit; text-underline-offset:4px; }
    button,a { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    button:disabled { cursor:default; opacity:.55; }
    :focus-visible { outline:3px solid #bfa36c; outline-offset:4px; }
    .wrap { max-width:1120px; margin:auto; padding-inline:28px; }
    header { position:sticky; top:0; z-index:5; background:var(--dark); color:#f7f7f7; }
    .header-inner { min-height:76px; display:flex; align-items:center; gap:32px; }
    .brand { display:inline-flex; flex-shrink:0; align-items:center; }
    .brand img { display:block; width:142px; height:auto; }
    nav { margin-left:auto; display:flex; gap:24px; align-items:center; font-size:13px; }
    nav a { text-decoration:none; }
    nav a:hover { color:#d6b777; }
    .language-control { display:inline-flex; position:relative; flex-shrink:0; }
    .language-control::after { content:""; position:absolute; right:13px; top:calc(50% - 5px); width:6px; height:6px; border-right:1px solid currentColor; border-bottom:1px solid currentColor; transform:rotate(45deg); pointer-events:none; }
    .language { appearance:none; background:#25292e; border:1px solid #4b5057; border-radius:4px; color:white; padding:7px 31px 7px 12px; max-width:140px; font-size:12px; }
    h1,h2,h3,p { margin-top:0; }
    h1 { max-width:760px; margin-bottom:22px; font-size:clamp(32px,4.8vw,58px); line-height:1.2; letter-spacing:-.025em; font-weight:600; }
    h2 { font-size:30px; line-height:1.4; letter-spacing:-.02em; font-weight:600; margin-bottom:12px; }
    h3 { font-size:20px; line-height:1.45; margin-bottom:12px; font-weight:600; }
    p { margin-bottom:18px; }
    .muted { color:var(--muted); }
    .hero { padding:88px 0 64px; border-bottom:1px solid var(--line); text-align:center; }
    .hero h1,.hero .lead { margin-inline:auto; }
    .hero h1 { font-size:clamp(40px,5.5vw,76px); line-height:1.18; }
    .lead { max-width:730px; font-size:18px; color:#5d656e; line-height:1.9; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; align-items:center; }
    .btn { display:inline-flex; min-height:42px; align-items:center; justify-content:center; padding:8px 18px; border:1px solid #cdd2d7; border-radius:4px; background:white; text-decoration:none; font-size:14px; color:var(--ink); }
    .btn.primary { background:var(--ink); color:white; border-color:var(--ink); }
    .btn:hover { border-color:var(--gold); }
    section { padding:64px 0; border-bottom:1px solid var(--line); scroll-margin-top:0; }
    .section-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:28px; margin-bottom:30px; }
    .section-heading p { max-width:610px; color:var(--muted); margin:0; }
    .experience-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:36px; }
    .product .product-promise { color:var(--ink); font-size:22px; line-height:1.5; font-weight:500; }
    .product-tabs { display:flex; justify-content:center; margin:34px 0; gap:8px; }
    .product-tabs button { min-width:138px; padding:10px 22px; border:1px solid var(--line); border-radius:4px; background:var(--paper); color:var(--muted); }
    .product-tabs button:hover { border-color:var(--gold); color:var(--ink); }
    .product-tabs button[aria-selected="true"] { background:var(--ink); border-color:var(--ink); color:white; }
    .products { display:block; }
    .product { padding-top:28px; border-top:1px solid var(--line); }
    .product > p { max-width:760px; }
    .product p { color:var(--muted); }
    .features { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:28px; padding:0; margin:24px 0; list-style:none; font-size:14px; }
    .features li { padding-top:14px; border-top:1px solid var(--line); }
    .features b { font-weight:500; }
    .features p { margin:7px 0 0; color:var(--muted); font-size:14px; }
    .text-link { font-size:14px; font-weight:500; }
    .product > .text-link { display:block; width:fit-content; max-width:100%; margin-inline:auto; }
    .flow-section { background:var(--wash); }
    .flow-section .section-heading { align-items:center; }
    .flow-section .section-heading > .btn { flex-shrink:0; white-space:nowrap; }
    .motion-reference { aspect-ratio:16/9; overflow:hidden; border-radius:8px; border:1px solid #333; background:#050505; }
    .motion-reference picture,.motion-reference img { width:100%; height:100%; display:block; object-fit:contain; }


    .terminal-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
    .terminal { display:flex; flex-direction:column; border:1px solid var(--line); border-radius:4px; padding:25px; }
    .terminal .platform { color:var(--muted); font-size:12px; margin-bottom:16px; }
    .terminal p { color:var(--muted); font-size:14px; }
    .terminal .entry { margin-top:auto; display:flex; gap:8px; flex-wrap:wrap; }
    .terminal .entry .btn { flex:1; font-size:12px; padding:8px 10px; white-space:nowrap; }
    .pending { margin:12px 0 0; font-size:12px; color:var(--muted); }
    #help .section-heading p { max-width:none; }
    .support-grid { display:grid; grid-template-columns:1.5fr 1fr; gap:48px; }
    details { border-bottom:1px solid var(--line); }
    summary { padding:18px 26px 18px 0; cursor:pointer; font-weight:500; }
    details p { font-size:14px; color:var(--muted); padding-right:20px; }
    .manual-entry { padding:28px; background:var(--wash); align-self:start; }
    .manual-entry p { color:var(--muted); font-size:14px; }
    .contact-grid { display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:36px; }
    .contact-item { border-top:1px solid var(--line); padding-top:16px; }
    .contact-item small { display:block; color:var(--muted); margin-bottom:8px; }
    .contact-item p { font-size:15px; }
    .manual-head { background:var(--wash); padding:36px 0; border-bottom:1px solid var(--line); }
    .manual-head h1 { font-size:36px; margin:16px 0; }
    .manual-layout { display:grid; grid-template-columns:240px minmax(0,1fr); gap:54px; padding-block:44px 80px; min-height:580px; }
    aside { min-width:0; }
    aside input { width:100%; padding:10px 12px; border:1px solid #cdd2d7; border-radius:4px; background:white; font-size:13px; }
    .chapter-list { display:grid; gap:5px; margin-top:16px; }
    .chapter-list a { padding:10px 12px; text-decoration:none; font-size:14px; border-left:2px solid transparent; }
    .chapter-list a[aria-current="page"] { background:var(--wash); border-color:var(--gold); }
    article { max-width:720px; }
    article h2 { margin-bottom:24px; }
    article li { padding:6px 0 12px 8px; }
    article ol { padding-left:22px; }
    .manual-bottom { display:flex; justify-content:space-between; gap:20px; margin-top:35px; border-top:1px solid var(--line); padding-top:20px; }
    [hidden] { display:none !important; }
    @media(max-width:800px) {
      html { scroll-padding-top:170px; }
      .wrap { padding-inline:20px; }
      .header-inner { gap:18px; flex-wrap:wrap; padding-block:17px; }
      .brand img { width:124px; }
      .language-control { margin-left:auto; }
      nav { order:3; width:100%; overflow-x:auto; gap:24px; margin:0; padding-top:7px; white-space:nowrap; }
      .hero { padding:48px 0 38px; }
      .lead { font-size:16px; }
      section { padding:44px 0; }
      h2 { font-size:25px; }
      .section-heading { display:block; }
      .flow-section .section-heading > .btn { margin-top:20px; }
      .experience-grid,.features,.terminal-grid,.support-grid,.contact-grid { grid-template-columns:1fr; gap:28px; }
      .manual-layout { grid-template-columns:minmax(0,1fr); gap:30px; padding-block:28px 50px; }
      .chapter-list { display:flex; overflow-x:auto; white-space:nowrap; }
      .manual-head h1 { font-size:30px; }
    }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
    @media print { header,aside,.manual-bottom,.note { display:none; } .manual-layout { display:block; } .wrap { max-width:none; } section { break-inside:avoid; } }
  </style>

    const navTargets = ['products','flow','terminals','help','contact'];

    function header(t) {
      return `<header><div class="wrap header-inner">
          <a class="brand" href="#home" aria-label="FAUCON TRADE"><img src="${logo}" alt="FAUCON TRADE"></a>
          <nav aria-label="${t.home}">${t.nav.map((label,index) => `<a href="#${navTargets[index]}">${label}</a>`).join('')}</nav>
          <span class="language-control"><select class="language" aria-label="Language"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option></select></span>
        </div></header>`;
    }

    function home(t) {
      return `<main>
        <div class="hero" id="home"><div class="wrap">
          <h1>${t.heroTitle}</h1><p class="lead">${t.heroText}</p>
        </div></div>
        <section id="experience"><div class="wrap"><div class="experience-grid">${t.experiences.map(([title,text]) => `<div><h3>${title}</h3><p class="muted">${text}</p></div>`).join('')}</div></div></section>
        <section id="products"><div class="wrap"><div class="section-heading"><div><h2>${t.productTitle}</h2><p>${t.productText}</p></div></div>
          <div class="product-tabs" role="tablist" aria-label="${t.productTitle}">${t.products.map((item,index) => `<button type="button" role="tab" id="product-tab-${index}" aria-controls="product-panel-${index}" aria-selected="${index === activeProduct}" tabindex="${index === activeProduct ? 0 : -1}" data-product="${index}">${item.name}</button>`).join('')}</div>
          <div class="products">${t.products.map((item,index) => `<div class="product" role="tabpanel" id="product-panel-${index}" aria-labelledby="product-tab-${index}" tabindex="0" ${index === activeProduct ? '' : 'hidden'}><h3 class="product-promise">${item.promise}</h3><p>${item.text}</p><ul class="features">${item.features.map((text,index) => `<li><b>${text}</b><p>${item.details[index]}</p></li>`).join('')}</ul><a class="text-link" href="#/manual/${index === 0 ? 'trs' : 'options'}">${item.link} ↗</a></div>`).join('')}</div>
        </div></section>
        <section class="flow-section" id="flow"><div class="wrap"><div class="section-heading"><div><h2>${t.flowTitle}</h2><p>${t.flowText}</p></div><a class="btn primary" href="#/manual/start">${t.manualOpen}</a></div>
          <div id="flow-content"></div>
        </div></section>
        <section id="terminals"><div class="wrap"><div class="section-heading"><div><h2>${t.terminalTitle}</h2><p>${t.terminalText}</p></div></div>
          <div class="terminal-grid">${t.terminalNames.map((name,index) => `<div class="terminal"><p class="platform">${t.terminalPlatforms[index]}</p><h3>${name}</h3><p>${t.terminalTexts[index]}</p><div class="entry">${index === 1 ? `<button class="btn" disabled>${t.customer}</button>` : `<button class="btn" disabled>${index === 0 ? t.download : t.appEntry}</button>`}</div></div>`).join('')}</div>
        </div></section>
        <section id="help"><div class="wrap"><div class="section-heading"><div><h2>${t.faqTitle}</h2><p>${t.faqText}</p></div></div>
          <div class="support-grid"><div>${t.faqs.map(([question,answer]) => `<details data-faq><summary>${question}</summary><p>${answer}</p></details>`).join('')}</div><div class="manual-entry"><h3>${t.manualTitle}</h3><p>${t.manualText}</p><a class="btn primary" href="#/manual/start">${t.manualOpen} ↗</a></div></div>
        </div></section>
        <section id="contact"><div class="wrap"><div class="contact-grid"><div><h2>${t.contactTitle}</h2><p class="muted">${t.contactText}</p></div><div class="contact-item"><small>${t.phone}</small><p>${t.phonePending}</p></div><div class="contact-item"><small>${t.email}</small><p>${t.emailPending}</p></div></div></div></section>
      </main>`;
    }

    function updateFlow() {
      const content = document.getElementById('flow-content');
      if (!content) return;
      const t = copy[language];
      content.innerHTML = `<div class="motion-reference"><picture><source media="(prefers-reduced-motion: reduce)" srcset="assets/workspace-still.png"><img src="assets/workspace-preview.gif" width="960" height="540" alt="${t.motionAlt}"></picture></div>`;
    }

    function manual(t, topic) {
      const chapter = t.chapters.find(item => item[0] === topic) || t.chapters[0];
      return `<main><div class="manual-head"><div class="wrap"><a href="#home">${t.home}</a><span class="muted"> / ${t.manualTitle}</span><h1>${t.manualTitle}</h1><p class="muted">${t.manualIntro}</p></div></div>
        <div class="wrap manual-layout"><aside aria-label="${t.manualTitle}"><input type="search" id="manual-search" placeholder="${t.search}" aria-label="${t.search}"><div class="chapter-list">${t.chapters.map(([id,label]) => `<a href="#/manual/${id}" ${chapter[0] === id ? 'aria-current="page"' : ''}>${label}</a>`).join('')}</div><p id="no-result" class="pending" hidden>${t.noResult}</p></aside>
        <article><h2>${chapter[1]}</h2><h3>${chapter[2]}</h3><ol>${chapter[3].map(text => `<li>${text}</li>`).join('')}</ol><div class="manual-bottom"><a href="#home">← ${t.backHome}</a><button class="btn" data-action="print">${t.print}</button></div></article></div></main>`;
    }

    function render(preserveScroll = false) {
      const scroll = window.scrollY;
      const t = copy[language];
      const isManual = location.hash.startsWith('#/manual/');
      const topic = location.hash.split('/')[2] || 'start';
      document.documentElement.lang = language;
      document.title = `FAUCON TRADE · ${isManual ? t.manualTitle : t.footer}`;
      app.innerHTML = header(t) + (isManual ? manual(t, topic) : home(t));
      app.querySelector('.language').value = language;
      if (!isManual) updateFlow();
      requestAnimationFrame(() => {
        if (preserveScroll) window.scrollTo(0, scroll);
        else if (isManual || !location.hash) window.scrollTo(0, 0);
        else document.getElementById(location.hash.slice(1))?.scrollIntoView();
      });
    }

    function selectProduct(index, focusTab = false) {
      activeProduct = index;
      app.querySelectorAll('[data-product]').forEach(tab => {
        const selected = Number(tab.dataset.product) === index;
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
        document.getElementById(tab.getAttribute('aria-controls')).hidden = !selected;
        if (selected && focusTab) tab.focus();
      });
    }

    app.addEventListener('keydown', event => {
      const tab = event.target.closest('[data-product]');
      if (!tab) return;
      const nextTab = { ArrowLeft: 1 - activeProduct, ArrowRight: 1 - activeProduct, Home: 0, End: 1 }[event.key];
      if (nextTab === undefined) return;
      event.preventDefault();
      selectProduct(nextTab, true);
    });

    app.addEventListener('click', event => {
      const productTab = event.target.closest('[data-product]');
      if (productTab) selectProduct(Number(productTab.dataset.product));
      if (event.target.closest('[data-action="print"]')) window.print();
    });

    app.addEventListener('change', event => {
      if (!event.target.matches('.language')) return;
      language = event.target.value;
      const url = new URL(location.href);
      url.searchParams.set('lang', language);
      history.replaceState(null, '', url);
      render(true);
    });

    app.addEventListener('input', event => {
      if (event.target.id !== 'manual-search') return;
      const query = event.target.value.trim().toLocaleLowerCase();
      const links = app.querySelectorAll('.chapter-list a');
      links.forEach(link => { link.hidden = !link.textContent.toLocaleLowerCase().includes(query); });
      document.getElementById('no-result').hidden = [...links].some(link => !link.hidden);
    });

    window.addEventListener('hashchange', () => render());
    render();
  </script>
</body>
</html>
